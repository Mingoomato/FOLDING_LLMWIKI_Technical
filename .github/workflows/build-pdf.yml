name: Build LLMWiki PDF

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up TeX Live
      uses: xu-cheng/latex-action@v3
      with:
        root_file: LLMWiki.tex
        compiler: lualatex
        args: -interaction=nonstopmode -halt-on-error -file-line-error -synctex=1 -output-directory=build
        working_directory: .

    - name: Copy PDF to root
      run: |
        cp build/LLMWiki.pdf ./LLMWiki.pdf
        
    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: LLMWiki-PDF
        path: ./LLMWiki.pdf
        retention-days: 30
