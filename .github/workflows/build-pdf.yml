name: Build LLMWiki PDF

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up TeX Live
      uses: xu-cheng/latex-action@v3
      with:
        root_file: LLMWiki.tex
        compiler: lualatex
        args: -interaction=nonstopmode -halt-on-error -file-line-error -synctex=1 -output-directory=build
        working_directory: .
        extra_packages: |
          latexmk
          fontawesome5
          academicons
          luatexbase
          lualibs
          luaotfload
          unicode-math
          fontspec
          pgfplots
          circuitikz
          forest
          tikz-qtree
          algorithmicx
          algorithm
          algpseudocode
          glossaries
          acro
          booktabs
          longtable
          multirow
          caption
          subcaption
          float
          hyperref
          cleveref
          listings
          xcolor
          mdframed
          tcolorbox
          enumitem
          csquotes
          makeidx
          appendix
          afterpage
          rotating
          lscape
          colortbl
          hhline
          threeparttable
          siunitx
          physics
          bm
          bbm
          stmaryrd
          turnstile
          logicproof
          bussproofs
          mathpartir
          natbib
          bibentry
          doi
          url
          orcidlink
          authblk
          geometry
          fancyhdr
          titlesec
          titletoc
          minitoc
          tocloft
          quotchap
          epigraph
          ccicons
          pdfx
          upquote

    - name: Build PDF with latexmk
      run: |
        latexmk -lualatex -interaction=nonstopmode -halt-on-error -file-line-error -synctex=1 -output-directory=build LLMWiki.tex
        
    - name: Copy PDF to root
      run: |
        cp build/LLMWiki.pdf ./LLMWiki.pdf
        
    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: LLMWiki-PDF
        path: ./LLMWiki.pdf
        retention-days: 30
